name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS is the platform this wrapper targets; /usr/bin/python3 there is
    # 3.9, which is the interpreter floor the code claims to support. Linux is
    # the second leg: the suite is pure stdlib, and it keeps CI able to run
    # when GitHub's macOS runner pool has no capacity (seen 2026-11-03, jobs
    # unacquired for 15+ minutes).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: python3 -m unittest discover -p "test_*.py"
